server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /it/assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # The entry document contains the current hashed asset filenames. It must
    # be revalidated after every deployment, otherwise a normal browser can
    # keep requesting chunks from the previous release while an incognito
    # window works with a clean cache.
    location = /it/index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Canonicalize any casing (/IT, /It/..., etc.) without a permanent
    # redirect, so an old redirect cannot remain stuck in the browser cache.
    location = /it { return 302 /it/; }
    location ~ ^/(?:IT|It|iT)(?:/(.*))?$ { return 302 /it/$1; }

    location ^~ /it/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /it/index.html;
    }
}
